server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Flexible SSL : l'origine voit du HTTP.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript
               application/xml+rss application/javascript application/json
               application/font-woff application/font-woff2 font/woff font/woff2
               image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self';" always;

    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Vérification Google Search Console
    location ~* ^/google[a-zA-Z0-9]+\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Logos publics (URLs stables presse / SEO)
    location = /logo/nbg {
        default_type image/png;
        alias /usr/share/nginx/html/logo/nbg.png;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition 'inline; filename="kobe-corporation-logo-nbg.png"';
    }
    location = /logo/full {
        default_type image/png;
        alias /usr/share/nginx/html/logo/full.png;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition 'inline; filename="kobe-corporation-logo.png"';
    }
    location = /logo {
        return 302 /logo/full;
    }

    location = /favicon.ico {
        try_files $uri /favicon.png /logo/full.png =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location = /apple-touch-icon.png {
        try_files $uri /favicon.png /logo/full.png =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # OG + assets SEO
    location ~* ^/(og-image\.png|og-image\.jpg|favicon\.png|robots\.txt|sitemap\.xml|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        autoindex off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|wordpress|wlwmanifest\.xml) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Racine → EN (hreflang x-default)
    location = / {
        return 301 /en;
    }

    rewrite ^/(fr|en)/home/?$ /$1 permanent;
    rewrite ^/home/?$ /en permanent;
    rewrite ^/(services|programmes|about|portfolio|contact|privacy|legal|terms)/?$ /en/$1 permanent;

    # Sans trailing slash (aligné sitemap + canonical)
    rewrite ^/(.*)/$ /$1 permanent;

    # SPA + prerender
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
