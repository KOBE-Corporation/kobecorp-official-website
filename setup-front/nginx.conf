server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Flexible SSL : l'origine voit du HTTP.
    # Évite des Location: http://... qui cassent le crawl Google / Meta.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript
               application/xml+rss application/javascript application/json
               application/font-woff application/font-woff2 font/woff font/woff2
               image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # frame-ancestors 'self' n'empêche pas facebookexternalhit / Googlebot de crawler
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self';" always;

    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Fichier de vérification Google Search Console (googleXXXXXXXX.html)
    location ~* ^/google[a-zA-Z0-9]+\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri /favicon.png /logo-nom.jpeg =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location = /apple-touch-icon.png {
        try_files $uri /favicon.png /logo-nom.jpeg =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # OG image + assets SEO (cache court pour permettre le refresh Meta Debugger)
    location ~* ^/(og-image\.png|favicon\.png|robots\.txt|sitemap\.xml|logo-nom\.jpeg|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        autoindex off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|wordpress|wlwmanifest\.xml) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Racine → EN (hreflang x-default) — redirection serveur pour Google / Meta
    location = / {
        return 301 /en;
    }

    rewrite ^/(fr|en)/home/?$ /$1 permanent;
    rewrite ^/home/?$ /en permanent;
    rewrite ^/(services|programmes|about|portfolio|contact|privacy|legal|terms)/?$ /en/$1 permanent;

    # Sans trailing slash (aligné sitemap + canonical + OG:url)
    rewrite ^/(.*)/$ /$1 permanent;

    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
