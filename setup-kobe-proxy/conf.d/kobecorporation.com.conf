# ==========================================
# KOBE Corporation — Reverse Proxy (Cloudflare Flexible)
# ==========================================
# Cloudflare termine le HTTPS côté client.
# Le VPS reçoit uniquement du HTTP (port 80).
# ==========================================

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

upstream kobe_web_backend {
    server kobecorporation-web:80;
    keepalive 32;
}

# Apex → www (évite contenu dupliqué apex/www)
server {
    listen 80;
    server_name kobecorporation.com;

    access_log /var/log/nginx/kobecorp_apex_access.log;
    error_log  /var/log/nginx/kobecorp_apex_error.log warn;

    return 301 https://www.kobecorporation.com$request_uri;
}

# www.kobecorporation.com
server {
    listen 80;
    server_name www.kobecorporation.com;

    access_log /var/log/nginx/kobecorp_access.log;
    error_log  /var/log/nginx/kobecorp_error.log warn;

    location / {
        proxy_pass http://kobe_web_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://kobe_web_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        proxy_pass http://kobe_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        proxy_pass http://kobe_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /favicon.ico {
        proxy_pass http://kobe_web_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Image Open Graph pour Meta / LinkedIn / WhatsApp
    location = /og-image.png {
        proxy_pass http://kobe_web_backend;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location = /manifest.json {
        proxy_pass http://kobe_web_backend;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    location ~* ^/google[a-zA-Z0-9]+\.html$ {
        proxy_pass http://kobe_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }
}
